<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1b1f24">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="きろく">
<title>きろく</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
  :root{
    --bg:#fff6f5; --card:#ffffff; --ink:#3b3031; --sub:#9a8a8c; --line:#f3dfe0;
    --accent:#f08aa0; --accent-deep:#e0607e; --accent-ink:#fff; --soft:#fde9ed; --soft2:#fff1f3;
    --warn:#e0607e; --ok:#5aa88a; --okbg:#e8f6ef;
    --tab-h:64px; --r:22px;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#221a1c; --card:#2d2326; --ink:#f6eef0; --sub:#b19ea2; --line:#43343a; --soft:#4a2f37; --soft2:#3a2a2f; --okbg:#2b4238; }
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP",sans-serif;font-size:16px;line-height:1.5}
  body{padding-bottom:calc(var(--tab-h) + env(safe-area-inset-bottom))}
  header{padding:calc(14px + env(safe-area-inset-top)) 18px 8px;display:flex;align-items:baseline;justify-content:space-between}
  header h1{font-size:24px;margin:0;font-weight:800;letter-spacing:.02em}
  header h1::after{content:" ♡";color:var(--accent);font-size:18px}
  header .who{font-size:13px;color:var(--sub)}
  main{padding:0 14px 20px}
  .view{display:none}.view.active{display:block}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px;box-shadow:0 4px 18px rgba(240,138,160,.08)}
  .big{font-size:44px;font-weight:800;letter-spacing:-.02em;line-height:1}
  .big small{font-size:16px;font-weight:600;color:var(--sub);margin-left:4px}
  .label{font-size:12px;color:var(--sub);letter-spacing:.06em}
  .row{display:flex;gap:10px;align-items:center}
  .grow{flex:1}
  .muted{color:var(--sub);font-size:13px}
  .pill{display:inline-block;padding:5px 12px;border-radius:999px;font-size:12px;font-weight:700;background:var(--soft);color:var(--accent-deep)}
  .pill.warn{background:#fde2e2;color:#c94c5f}
  .bar{height:10px;background:var(--soft2);border-radius:999px;overflow:hidden;margin-top:10px}
  .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),#f7b2c0);border-radius:999px;transition:width .4s}
  .bar i.over{background:var(--warn)}

  /* today ring */
  .today{display:flex;align-items:center;gap:10px}
  .ring{position:relative;width:150px;height:150px;flex:none}
  .ring svg{width:150px;height:150px;transform:rotate(-90deg)}
  .ring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
  .ring .c .l{font-size:11px;color:var(--sub)}
  .ring .c .v{font-size:38px;font-weight:800;line-height:1.05;color:var(--accent-deep)}
  .ring .c .u{font-size:12px;color:var(--sub)}
  .mascot{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px}
  .bubble{background:var(--soft);border-radius:16px;padding:8px 12px;font-size:13px;font-weight:700;color:var(--accent-deep);position:relative;text-align:center}
  .bubble::after{content:"";position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);border:6px solid transparent;border-top-color:var(--soft);border-bottom:0}
  .mascot svg{width:92px;height:92px}

  /* actions */
  .actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
  .act{border:none;border-radius:var(--r);padding:18px 10px;font-size:16px;font-weight:800;color:var(--accent-deep);background:var(--soft);display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer}
  .act span.ic{font-size:30px;line-height:1}
  .act.secondary{background:var(--card);border:1px solid var(--line);color:var(--ink)}
  .act.recording{background:var(--warn);color:#fff;animation:pulse 1s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.7}}
  .textrow{display:flex;gap:8px}
  .textrow input{flex:1;border:1px solid var(--line);border-radius:999px;padding:12px 16px;font-size:16px;background:var(--card);color:var(--ink)}
  .textrow button{border:none;border-radius:999px;width:46px;background:var(--accent);color:#fff;font-weight:800;font-size:18px}
  #voiceStatus{font-size:13px;color:var(--sub);min-height:18px;margin-top:6px;text-align:center}

  /* list */
  .item{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--line);align-items:center}
  .item:first-child{border-top:none}
  .item .ico{width:40px;height:40px;border-radius:12px;background:var(--soft2);display:flex;align-items:center;justify-content:center;font-size:22px;flex:none}
  .item .t{font-size:11px;color:var(--sub)}
  .item .n{flex:1;min-width:0}
  .item .n b{font-weight:700}
  .item .k{font-weight:800;flex:none;color:var(--accent-deep)}
  .item .k::after{content:" kcal";font-size:11px;color:var(--sub);font-weight:600}
  .item .meal{font-size:11px;color:var(--sub);margin-right:6px}
  .item .bd{font-size:12px;color:var(--sub);margin-top:2px;line-height:1.4}
  .item .del{border:none;background:none;color:var(--sub);font-size:18px;padding:0 4px;cursor:pointer}
  .pending{display:flex;gap:10px;align-items:center;padding:12px;border-radius:16px;background:var(--soft);margin-bottom:10px;font-size:14px}
  .spin{width:16px;height:16px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:rot .8s linear infinite;flex:none}
  @keyframes rot{to{transform:rotate(360deg)}}
  .comment{background:var(--soft2);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;font-size:15px;margin-top:10px}
  .comment .who{font-size:11px;color:var(--accent-deep);font-weight:800;margin-bottom:2px}
  .bdlist{margin:6px 0 8px;border-top:1px solid var(--line)}
  .bdrow{display:flex;justify-content:space-between;font-size:13px;padding:3px 0;border-bottom:1px solid var(--line)}
  .bdrow b{font-weight:800;color:var(--accent-deep)}
  .fixrow{display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap}
  .fixbtn{border:1px solid var(--accent);background:var(--card);color:var(--accent-deep);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:800}

  /* charts */
  svg{width:100%;height:auto;display:block}
  .legend{display:flex;gap:14px;font-size:12px;color:var(--sub);margin-top:6px}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:middle}
  .seg{display:flex;background:var(--soft2);border-radius:999px;padding:3px;margin-bottom:12px}
  .seg button{flex:1;border:none;background:none;border-radius:999px;padding:7px 0;font-size:13px;font-weight:700;color:var(--sub)}
  .seg button.on{background:var(--accent);color:#fff}
  .daylist details{border-top:1px solid var(--line);padding:8px 0}
  .daylist summary{display:flex;justify-content:space-between;cursor:pointer;list-style:none;font-size:15px}
  .daylist summary::-webkit-details-marker{display:none}
  .daylist .d{color:var(--sub)}
  .daylist .plus{color:var(--warn);font-weight:800}
  .daylist .minus{color:var(--ok);font-weight:800}
  .wrow{display:flex;gap:8px;margin-top:10px}
  .wrow input{flex:1;min-width:0;width:0;border:1px solid var(--line);border-radius:14px;padding:12px 8px;font-size:17px;text-align:center;background:var(--card);color:var(--ink)}
  .wrow button{flex:none;border:none;border-radius:14px;padding:0 16px;background:var(--accent);color:#fff;font-weight:800;white-space:nowrap}

  /* chat */
  .chathead{display:flex;align-items:center;gap:12px;margin-bottom:10px}
  .chathead svg{width:64px;height:64px;flex:none}
  .chathead .nm{font-weight:800;font-size:16px}
  .chathead .st{font-size:12px;color:var(--ok)}
  .chatlog{display:flex;flex-direction:column;gap:8px;min-height:40vh}
  .msg{max-width:84%;padding:10px 14px;border-radius:18px;font-size:15px;white-space:pre-wrap;line-height:1.55}
  .msg.u{align-self:flex-end;background:var(--accent-deep);color:#fff;border-bottom-right-radius:6px}
  .msg.a{align-self:flex-start;background:var(--card);border:1px solid var(--line);border-bottom-left-radius:6px}
  .chatin{position:sticky;bottom:calc(var(--tab-h) + env(safe-area-inset-bottom) + 8px);display:flex;gap:8px;margin-top:12px}
  .chatin input{flex:1;border:1px solid var(--line);border-radius:999px;padding:12px 16px;font-size:16px;background:var(--card);color:var(--ink)}
  .chatin button{border:none;border-radius:999px;width:46px;background:var(--accent);color:#fff;font-size:18px}
  .quick{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
  .quick button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:7px 13px;font-size:13px;font-weight:600}

  /* settings */
  .field{margin-top:10px}
  .field label{display:block;font-size:12px;color:var(--sub);margin-bottom:4px}
  .field input{width:100%;border:1px solid var(--line);border-radius:14px;padding:12px;font-size:17px;background:var(--card);color:var(--ink)}
  .field2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .ghost{margin-top:12px;width:100%;border:1px solid var(--line);background:var(--card);color:var(--accent-deep);border-radius:999px;padding:12px;font-weight:800;font-size:14px}

  /* tabs */
  nav{position:fixed;left:0;right:0;bottom:0;height:calc(var(--tab-h) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:var(--card);border-top:1px solid var(--line);display:flex}
  nav button{flex:1;border:none;background:none;color:var(--sub);font-size:11px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
  nav button span{font-size:22px;filter:grayscale(1);opacity:.6}
  nav button.on{color:var(--accent-deep)}
  nav button.on span{filter:none;opacity:1}

  /* setup */
  #setup{position:fixed;inset:0;background:var(--bg);display:none;flex-direction:column;justify-content:center;padding:30px;gap:12px;z-index:10}
  #setup.show{display:flex}
  #setup input{border:1px solid var(--line);border-radius:14px;padding:14px;font-size:18px;background:var(--card);color:var(--ink)}
  #setup button{border:none;border-radius:999px;padding:14px;background:var(--accent);color:#fff;font-size:17px;font-weight:800}
  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tab-h) + 20px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;z-index:20}
  .toast.show{opacity:1}
  .toast.err{background:var(--warn)}
  .sheet{position:fixed;inset:0;background:rgba(40,20,25,.35);display:flex;align-items:flex-end;justify-content:center;z-index:30;padding:0 12px calc(12px + env(safe-area-inset-bottom))}
  .sheet-box{width:100%;max-width:480px;display:flex;flex-direction:column;gap:8px}
  .sheet-box button{border:none;border-radius:18px;padding:16px;font-size:17px;font-weight:800;background:var(--card);color:var(--accent-deep)}
  .sheet-box button.cancel{color:var(--sub);font-weight:700}
  .hidden{display:none!important}
</style>
</head>
<body>

<div id="setup">
  <h2 style="margin:0 0 4px">はじめまして</h2>
  <p class="muted" style="margin:0 0 10px">最初に一回だけ、名前と合言葉を入れてね。</p>
  <input id="suUser" placeholder="名前（ina / wife / daughter）" autocapitalize="none" autocomplete="off">
  <input id="suToken" placeholder="合言葉" autocapitalize="none" autocomplete="off">
  <button id="suBtn">はじめる</button>
  <p id="suMsg" class="muted"></p>
</div>

<header>
  <h1>きろく</h1>
  <div class="who" id="who"></div>
</header>

<main>
  <!-- ========== 記録 ========== -->
  <section id="v-home" class="view active">
    <div class="card" id="todayCard">
      <div class="today">
        <div class="ring">
          <svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="52" fill="none" stroke="var(--soft2)" stroke-width="12"/><circle id="ringArc" cx="60" cy="60" r="52" fill="none" stroke="var(--accent)" stroke-width="12" stroke-linecap="round" stroke-dasharray="326.7" stroke-dashoffset="326.7" style="transition:stroke-dashoffset .6s"/></svg>
          <div class="c"><div class="l">今日のカロリー</div><div class="v" id="todayMain">–</div><div class="u">kcal</div></div>
        </div>
        <div class="mascot"><div class="bubble" id="todayPill">今日も<br>いっしょに♪</div><svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="54" r="38" fill="#ffd9df"/><ellipse cx="50" cy="30" rx="30" ry="14" fill="#8a5a4a"/><circle cx="26" cy="36" r="9" fill="#8a5a4a"/><circle cx="74" cy="36" r="9" fill="#8a5a4a"/><circle cx="38" cy="54" r="3.2" fill="#3b3031"/><circle cx="62" cy="54" r="3.2" fill="#3b3031"/><ellipse cx="30" cy="63" rx="6" ry="3.5" fill="#f7a8b8"/><ellipse cx="70" cy="63" rx="6" ry="3.5" fill="#f7a8b8"/><path d="M43 65 Q50 71 57 65" stroke="#3b3031" stroke-width="2.4" fill="none" stroke-linecap="round"/><path d="M78 24 l2.5 5 5.5 .8 -4 3.9 .9 5.5 -4.9-2.6 -4.9 2.6 .9-5.5 -4-3.9 5.5-.8z" fill="#f08aa0"/></svg></div>
      </div>
      <div class="muted" id="todaySub" style="margin-top:10px"></div>
      <div class="bar"><i id="todayBar" style="width:0%"></i></div>
    </div>

    <div class="actions">
      <button class="act" id="photoBtn"><span class="ic">📷</span>写真で記録<small style="font-size:11px;font-weight:500;opacity:.85">撮る／アルバムから</small></button>
      <button class="act secondary" id="micBtn"><span class="ic">🎤</span>話して記録</button>
    </div>
    <input type="file" id="photoInput" accept="image/*" class="hidden">
    <input type="file" id="cameraInput" accept="image/*" capture="environment" class="hidden">
    <div id="photoSheet" class="sheet hidden">
      <div class="sheet-box">
        <button id="pickCamera">📷 カメラで撮る</button>
        <button id="pickAlbum">🖼 アルバムから選ぶ</button>
        <button id="pickCancel" class="cancel">やめる</button>
      </div>
    </div>
    <div id="voiceStatus"></div>

    <form class="textrow" id="textForm" style="margin-top:8px">
      <input id="textInput" placeholder="食べたものを入力してみてね（例：昼にラーメン）" autocomplete="off">
      <button type="submit">↑</button>
    </form>
    <p class="muted" style="margin:8px 2px 14px">写真だけでもOK。ひとこと足すと精度が上がるよ（「ピーナッツバター」「大盛り」など）。あとから「昼はカレーだった」でも大丈夫。</p>

    <div id="pendingArea"></div>
    <div id="lastComment"></div>

    <div class="card" style="margin-top:12px">
      <div class="label">今日食べたもの</div>
      <div id="todayList" style="margin-top:8px"><div class="muted">まだ記録がないよ</div></div>
    </div>

    <div class="card" id="homeWeightCard">
      <div class="row"><div class="label grow">今朝の体重</div><div class="muted" id="homeWeightNote"></div></div>
      <div class="wrow" style="margin-top:8px">
        <input id="wIn2" type="number" step="0.1" inputmode="decimal" placeholder="体重 kg">
        <input id="fIn2" type="number" step="0.1" inputmode="decimal" placeholder="体脂肪%">
        <button id="wBtn2">記録</button>
      </div>
    </div>
  </section>

  <!-- ========== 推移 ========== -->
  <section id="v-trend" class="view">
    <div class="seg" id="periodSeg"><button class="on" data-days="7">1週間</button><button data-days="30">1ヶ月</button><button data-days="90">3ヶ月</button></div>
    <div class="card">
      <div class="label" id="weekLabel">この7日のカロリー収支</div>
      <div class="row" style="margin-top:6px">
        <div class="grow"><div class="big" id="weekMain">–</div><div class="muted" id="weekSub"></div></div>
      </div>
      <div id="kcalChart" style="margin-top:12px"></div>
      <div class="legend"><span><i style="background:var(--accent)"></i>食べた分</span><span><i style="background:var(--warn)"></i>多め</span><span><i style="background:var(--sub);height:2px"></i>目安</span></div>
      <button class="ghost" id="reviewBtn">今週の総括を聞く</button>
      <div id="reviewBox"></div>
    </div>

    <div class="card">
      <div class="label">体重</div>
      <div class="row" style="margin-top:6px">
        <div class="grow"><div class="big" id="wMain">–</div><div class="muted" id="wSub"></div></div>
      </div>
      <div id="wChart" style="margin-top:12px"></div>
      <div class="legend"><span><i style="background:var(--line)"></i>毎日</span><span><i style="background:var(--accent);height:3px"></i>7日平均</span></div>
      <div class="wrow">
        <input id="wIn" type="number" step="0.1" inputmode="decimal" placeholder="体重 kg">
        <input id="fIn" type="number" step="0.1" inputmode="decimal" placeholder="体脂肪%">
        <button id="wBtn">記録</button>
      </div>
    </div>

    <div class="card daylist">
      <div class="label">日ごと（タップで中身）</div>
      <div id="dayList" style="margin-top:6px"></div>
    </div>
  </section>

  <!-- ========== 相談 ========== -->
  <section id="v-chat" class="view">
    <div class="chathead"><svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="54" r="38" fill="#ffd9df"/><ellipse cx="50" cy="30" rx="30" ry="14" fill="#8a5a4a"/><circle cx="26" cy="36" r="9" fill="#8a5a4a"/><circle cx="74" cy="36" r="9" fill="#8a5a4a"/><circle cx="38" cy="54" r="3.2" fill="#3b3031"/><circle cx="62" cy="54" r="3.2" fill="#3b3031"/><ellipse cx="30" cy="63" rx="6" ry="3.5" fill="#f7a8b8"/><ellipse cx="70" cy="63" rx="6" ry="3.5" fill="#f7a8b8"/><path d="M43 65 Q50 71 57 65" stroke="#3b3031" stroke-width="2.4" fill="none" stroke-linecap="round"/><path d="M78 24 l2.5 5 5.5 .8 -4 3.9 .9 5.5 -4.9-2.6 -4.9 2.6 .9-5.5 -4-3.9 5.5-.8z" fill="#f08aa0"/></svg><div><div class="nm">きろくちゃん</div><div class="st">● いつでも聞いてね</div></div></div>
    <div class="quick">
      <button data-q="なんか食べたい！">なんか食べたい！</button>
      <button data-q="今日の調子どう？">今日の調子どう？</button>
      <button data-q="コンビニで何ならいい？">コンビニで何ならいい？</button>
      <button data-q="やらかした…">やらかした…</button>
    </div>
    <div class="chatlog" id="chatLog"></div>
    <form class="chatin" id="chatForm">
      <input id="chatInput" placeholder="相談・報告・ぼやき、なんでも" autocomplete="off">
      <button type="submit">↑</button>
    </form>
  </section>

  <!-- ========== 設定 ========== -->
  <section id="v-settings" class="view">
    <div class="card">
      <div class="label">わたし</div>
      <div class="field"><label>名前（表示用）</label><input id="pName"></div>
      <div class="field2">
        <div class="field"><label>身長 cm</label><input id="pHeight" type="number" inputmode="decimal" step="0.1"></div>
        <div class="field"><label>年齢</label><input id="pAge" type="number" inputmode="numeric"></div>
      </div>
    </div>
    <div class="card">
      <div class="label">目標</div>
      <div class="field2">
        <div class="field"><label>開始体重 kg</label><input id="pStart" type="number" inputmode="decimal" step="0.1"></div>
        <div class="field"><label>目標体重 kg</label><input id="pGoal" type="number" inputmode="decimal" step="0.1"></div>
      </div>
      <div class="field"><label>いつまでに</label><input id="pDate" type="date"></div>
      <p class="muted" id="paceNote" style="margin:4px 0 0"></p>
    </div>
    <div class="card" id="kcalCard">
      <div class="label">1日の目安</div>
      <div class="field2">
        <div class="field"><label>カロリー kcal</label><input id="pKcal" type="number" inputmode="numeric" step="10"></div>
        <div class="field"><label>たんぱく質 g</label><input id="pProt" type="number" inputmode="numeric"></div>
      </div>
      <button class="ghost" id="suggestBtn">身長・体重・期限から自動計算</button>
      <p class="muted" id="suggestNote" style="margin:6px 0 0"></p>
    </div>
    <button class="act" id="saveProfile" style="width:100%">保存</button>
    <p class="muted" style="margin-top:14px">体重と体脂肪は「記録」か「推移」から毎日入れてね。ここは変わらないものだけ。</p>

</main>

<nav>
  <button class="on" data-v="home"><span>🍽</span>記録</button>
  <button data-v="trend"><span>📈</span>推移</button>
  <button data-v="chat"><span>💬</span>相談</button>
  <button data-v="settings"><span>⚙️</span>設定</button>
</nav>

<div class="toast" id="toast"></div>

<script>
const GAS_URL = "https://script.google.com/macros/s/AKfycbyjr626gW5Li7oNB3F03fsXjWZSZLEj6B4zOUS2xffEtWMCk2VwDIXKc8p8jiHVeVSKEw/exec";

// ---------- 設定（localStorage） ----------
const LS = { u:'fd_user', t:'fd_token', chat:'fd_chat' };
let USER = localStorage.getItem(LS.u) || '';
let TOKEN = localStorage.getItem(LS.t) || '';
(function fromQuery(){
  const q = new URLSearchParams(location.search);
  if (q.get('u') && q.get('t')) {
    USER = q.get('u'); TOKEN = q.get('t');
    localStorage.setItem(LS.u, USER); localStorage.setItem(LS.t, TOKEN);
    history.replaceState(null, '', location.pathname);
  }
})();

let SUMMARY = null; let PERIOD = 7;
let SHOW_NUM = true;

// ---------- API ----------
async function api(body) {
  const res = await fetch(GAS_URL, { method:'POST', body: JSON.stringify(Object.assign({ user_id: USER, token: TOKEN }, body)), headers: { 'Content-Type': 'text/plain' } });
  const txt = await res.text();
  let j; try { j = JSON.parse(txt); } catch (e) { throw new Error('サーバーの返事が読めない'); }
  if (!j.ok) throw new Error(j.error || 'エラー');
  return j;
}

// ---------- UI helpers ----------
const $ = id => document.getElementById(id);
function toast(msg, err) { const t = $('toast'); t.innerText = msg; t.className = 'toast show' + (err ? ' err' : ''); clearTimeout(t._h); t._h = setTimeout(() => t.className = 'toast', 3200); }
let pseq = 0;
function addPending(label) { const id = 'p' + (++pseq); const el = document.createElement('div'); el.className = 'pending'; el.id = id; el.innerHTML = '<div class="spin"></div><div></div>'; el.lastChild.innerText = label; $('pendingArea').prepend(el); return id; }
function rmPending(id) { const el = $(id); if (el) el.remove(); }
function esc(s) { return String(s ?? '').replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c])); }
function showView(v) {
  document.querySelectorAll('.view').forEach(x => x.classList.toggle('active', x.id === 'v-' + v));
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.v === v));
  if (v === 'chat') { renderChat(); setTimeout(() => window.scrollTo(0, document.body.scrollHeight), 50); }
  if (v === 'settings') loadProfile();
  if (v !== 'chat') window.scrollTo(0, 0);
}
document.querySelectorAll('nav button').forEach(b => b.onclick = () => showView(b.dataset.v));

// ---------- 初期設定 ----------
async function boot() {
  if (!USER || !TOKEN) { $('setup').classList.add('show'); return; }
  try {
    await refresh();
    $('setup').classList.remove('show');
  } catch (e) {
    $('setup').classList.add('show');
    $('suMsg').innerText = e.message;
  }
}
$('suBtn').onclick = async () => {
  USER = $('suUser').value.trim(); TOKEN = $('suToken').value.trim();
  if (!USER || !TOKEN) return;
  $('suMsg').innerText = '確認中…';
  try {
    await api({ action: 'ping' });
    localStorage.setItem(LS.u, USER); localStorage.setItem(LS.t, TOKEN);
    $('suMsg').innerText = '';
    $('setup').classList.remove('show');
    await refresh();
  } catch (e) { $('suMsg').innerText = e.message; }
};

// ---------- サマリー取得・描画 ----------
async function refresh() {
  const j = await api({ action: 'summary', days: Math.max(14, PERIOD) });
  SUMMARY = j; SHOW_NUM = !!j.profile.show_numbers;
  render();
}
function render() {
  const s = SUMMARY; if (!s) return;
  $('who').innerText = s.profile.name;
  const t = s.today;
  const ratio = Math.min(1.15, t.kcal / t.target);
  $('todayBar').style.width = Math.min(100, ratio * 100) + '%';
  $('todayBar').className = t.kcal > t.target ? 'over' : '';
  $('todayMain').innerText = t.kcal;
  $('todaySub').innerText = t.remain_kcal >= 0 ? `あと ${t.remain_kcal} kcal（目安 ${t.target}）・たんぱく質 ${t.protein_g}g` : `${-t.remain_kcal} kcal オーバー（目安 ${t.target}）`;
  const arc = $('ringArc'); const C = 326.7; arc.style.strokeDashoffset = C * (1 - Math.min(1, t.kcal / t.target)); arc.style.stroke = t.kcal > t.target ? 'var(--warn)' : 'var(--accent)';
  const h = new Date().getHours();
  $('todayPill').innerHTML = t.kcal === 0 ? (h < 11 ? 'おはよう！<br>朝ごはん食べた？' : '今日も<br>いっしょに♪') : (t.remain_kcal < 0 ? 'ちょっと多め！<br>明日戻そ' : t.remain_kcal < 300 ? 'あと少し<br>いい感じ！' : 'いい感じ<br>だよ！この調子♪');
  // today list
  const L = $('todayList');
  if (!t.items.length) L.innerHTML = '<div class="muted">まだ記録がないよ</div>';
  else L.innerHTML = t.items.map(i => itemRow(i, true)).join('');
  L.querySelectorAll('.del').forEach(b => b.onclick = () => delLog(b.dataset.id));

  // week
  const pd = s.daily.slice(-PERIOD).filter(d => d.logged);
  const w = { diff_kcal: pd.reduce((a, d) => a + d.diff, 0), logged_days: pd.length };
  w.fat_kg_equiv = Math.round(w.diff_kcal / 7200 * 100) / 100;
  const sign = w.diff_kcal > 0 ? '+' : '';
  $('weekMain').innerHTML = w.logged_days ? `${sign}${w.diff_kcal}<small>kcal</small>` : '–';
  $('weekMain').style.color = w.diff_kcal > 0 ? 'var(--warn)' : 'var(--ok)';
  $('weekSub').innerText = w.logged_days ? `${w.logged_days}日分・目安との差の合計 ≒ 脂肪 ${w.fat_kg_equiv > 0 ? '+' : ''}${w.fat_kg_equiv}kg 相当` : 'まだ記録がないよ';
  $('weekLabel').innerText = PERIOD === 7 ? 'この7日のカロリー収支' : PERIOD === 30 ? 'この1ヶ月のカロリー収支' : 'この3ヶ月のカロリー収支';
  if (PERIOD === 7) drawKcal(s.daily.slice(-7)); else drawKcal(s.daily.slice(-PERIOD));
  // weight
  const lw = s.latest_weight;
  if (lw) {
    $('wMain').innerHTML = SHOW_NUM ? `${lw.weight_kg}<small>kg</small>` : `${lw.avg7}<small>kg（7日平均）</small>`;
    const first = s.weights[0];
    const d = Math.round((lw.avg7 - (first ? first.avg7 : lw.avg7)) * 10) / 10;
    $('wSub').innerText = SHOW_NUM ? `7日平均 ${lw.avg7}kg・開始から ${d > 0 ? '+' : ''}${d}kg${s.profile.goal_weight ? `・目標 ${s.profile.goal_weight}kg` : ''}` : `始めた頃から ${d > 0 ? '+' : ''}${d}kg`;
  } else { $('wMain').innerText = '–'; $('wSub').innerText = '朝いちで体重を入れてね'; }
  drawWeight(s.weights.slice(-30));
  const todayW = lw && lw.date === t.date;
  $('homeWeightNote').innerText = todayW ? (SHOW_NUM ? `今日 ${lw.weight_kg}kg 記録済み` : '今日は記録済み') : (lw ? `前回 ${lw.date.slice(5).replace('-', '/')}` : '');
  // day list
  $('dayList').innerHTML = s.daily.slice().reverse().filter(d => d.logged).map(d => {
    const diff = d.diff;
    const right = `<span>${d.kcal} <span class="${diff > 0 ? 'plus' : 'minus'}">${diff > 0 ? '+' : ''}${diff}</span></span>`;
    const items = d.items.map(i => itemRow(i, false)).join('');
    return `<details><summary><span class="d">${d.date.slice(5).replace('-', '/')}</span>${right}</summary><div style="margin-top:6px">${items}</div></details>`;
  }).join('') || '<div class="muted">まだ記録がないよ</div>';
}

// 内訳は note の先頭セグメント「とんかつ2切れ 200 / ご飯 250」
function breakdownOf(i) {
  if (Array.isArray(i.breakdown) && i.breakdown.length) return i.breakdown.map(b => `${b.name} ${b.kcal}`).join(' / ');
  const seg = String(i.note || '').split(' | ')[0];
  return /\d/.test(seg) && seg.includes(' ') && !/^補足|^写真から|^音声/.test(seg) ? seg : '';
}
const FOOD_ICONS = [[/ラーメン|うどん|そば|パスタ|スパゲ|焼きそば|麺/,'🍜'],[/カレー/,'🍛'],[/寿司|刺身|鮭|サバ|鯖|魚|ツナ|しらす/,'🐟'],[/とんかつ|カツ|唐揚|から揚|チキン|鶏|肉|ハンバーグ|ステーキ|焼肉|ソーセージ|ベーコン|ハム/,'🍖'],[/卵|たまご|オムレツ|目玉/,'🍳'],[/パン|トースト|サンド|バーガー|ピザ/,'🍞'],[/おにぎり|ご飯|ごはん|米|丼|玄米|チャーハン/,'🍙'],[/サラダ|キャベツ|野菜|きのこ|ブロッコリー|トマト|大根|ほうれん/,'🥗'],[/納豆|豆腐|味噌汁|みそ汁|スープ/,'🍲'],[/ヨーグルト|チーズ|牛乳|プロテイン/,'🥛'],[/ケーキ|チョコ|アイス|クッキー|ラムネ|お菓子|スナック|ポテチ|せんべい|柿の種|まんじゅう|プリン|ドーナツ/,'🍪'],[/りんご|バナナ|みかん|いちご|ぶどう|果物|フルーツ|柿/,'🍎'],[/コーヒー|お茶|紅茶|カフェ/,'☕'],[/ジュース|コーラ|サイダー|ソーダ/,'🥤'],[/ビール|酒|ワイン|焼酎|ハイボール|チューハイ/,'🍺']];
function foodIcon(name) { const t = String(name || ''); for (const [re, ic] of FOOD_ICONS) if (re.test(t)) return ic; return '🍽️'; }
function itemRow(i, withDel) {
  const bd = breakdownOf(i);
  return `<div class="item"><div class="ico">${foodIcon(i.items)}</div><div class="n"><span class="meal">${esc(i.time)} ${esc(i.meal)}</span><b>${esc(i.items)}</b>${bd ? `<div class="bd">${esc(bd)}</div>` : ''}</div><div class="k">${esc(i.kcal)}</div>${withDel ? `<button class="del" data-id="${esc(i.id)}" title="取り消す">×</button>` : ''}</div>`;
}

// ---------- charts (inline SVG) ----------
function drawKcal(days) {
  const W = 320, H = 140, pad = { l: 6, r: 6, t: 10, b: 22 };
  const target = days[0] ? days[0].target : 1600;
  const max = Math.max(target * 1.2, ...days.map(d => d.kcal)) || 1;
  const bw = (W - pad.l - pad.r) / days.length;
  const y = v => pad.t + (H - pad.t - pad.b) * (1 - v / max);
  let svg = `<svg viewBox="0 0 ${W} ${H}">`;
  svg += `<line x1="${pad.l}" x2="${W - pad.r}" y1="${y(target)}" y2="${y(target)}" stroke="var(--sub)" stroke-dasharray="3 3" stroke-width="1"/>`;
  days.forEach((d, i) => {
    const x = pad.l + i * bw + bw * 0.18, w = bw * 0.64;
    const h = d.logged ? Math.max(2, y(0) - y(d.kcal)) : 0;
    const col = d.kcal > target ? 'var(--warn)' : '#f7bfcb';
    if (d.logged) svg += `<rect x="${x}" y="${y(d.kcal)}" width="${w}" height="${h}" rx="${Math.min(4, w / 2)}" fill="${col}"/>`;
    else svg += `<rect x="${x}" y="${y(0) - 2}" width="${w}" height="2" rx="1" fill="var(--line)"/>`;
    const lbl = d.date.slice(8).replace(/^0/, '');
    const step = days.length > 14 ? Math.ceil(days.length / 7) : 1;
    if (i % step === 0 || i === days.length - 1) svg += `<text x="${x + w / 2}" y="${H - 6}" font-size="10" text-anchor="middle" fill="var(--sub)">${days.length > 14 ? d.date.slice(5).replace('-', '/') : lbl}</text>`;
    if (d.logged && days.length <= 7) svg += `<text x="${x + w / 2}" y="${y(d.kcal) - 3}" font-size="9" text-anchor="middle" fill="var(--sub)">${d.kcal}</text>`;
  });
  svg += '</svg>';
  $('kcalChart').innerHTML = svg;
}
function drawWeight(ws) {
  if (!ws.length) { $('wChart').innerHTML = '<div class="muted">記録が増えると線が出るよ</div>'; return; }
  const W = 320, H = 140, pad = { l: 30, r: 8, t: 10, b: 20 };
  const vals = ws.flatMap(w => [w.weight_kg, w.avg7]);
  let lo = Math.min(...vals), hi = Math.max(...vals);
  if (hi - lo < 1.5) { const m = (hi + lo) / 2; lo = m - 0.75; hi = m + 0.75; }
  lo = Math.floor(lo * 2) / 2 - 0.25; hi = Math.ceil(hi * 2) / 2 + 0.25;
  const x = i => pad.l + (W - pad.l - pad.r) * (ws.length === 1 ? 0.5 : i / (ws.length - 1));
  const y = v => pad.t + (H - pad.t - pad.b) * (1 - (v - lo) / (hi - lo));
  let svg = `<svg viewBox="0 0 ${W} ${H}">`;
  for (let g = Math.ceil(lo); g <= hi; g++) svg += `<line x1="${pad.l}" x2="${W - pad.r}" y1="${y(g)}" y2="${y(g)}" stroke="var(--line)" stroke-width="1"/><text x="${pad.l - 4}" y="${y(g) + 3}" font-size="9" text-anchor="end" fill="var(--sub)">${g}</text>`;
  if (SHOW_NUM) {
    svg += `<polyline fill="none" stroke="#f3c6d0" stroke-width="1.5" points="${ws.map((w, i) => x(i) + ',' + y(w.weight_kg)).join(' ')}"/>`;
    ws.forEach((w, i) => svg += `<circle cx="${x(i)}" cy="${y(w.weight_kg)}" r="2.2" fill="var(--sub)"/>`);
  }
  svg += `<polyline fill="none" stroke="var(--accent)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" points="${ws.map((w, i) => x(i) + ',' + y(w.avg7)).join(' ')}"/>`;
  const step = Math.max(1, Math.round(ws.length / 5));
  ws.forEach((w, i) => { if (i % step === 0 || i === ws.length - 1) svg += `<text x="${x(i)}" y="${H - 5}" font-size="9" text-anchor="middle" fill="var(--sub)">${w.date.slice(5).replace('-', '/')}</text>`; });
  svg += '</svg>';
  $('wChart').innerHTML = svg;
}

// ---------- 記録：共通 ----------
let LAST_ID = null, CORRECT_MODE = false;
function onLogged(j, label) {
  SUMMARY.today = j.today; LAST_ID = j.id; CORRECT_MODE = false;
  // refresh in background for full summary
  refresh().catch(() => {});
  const r = j.record;
  const head = `${r.meal} ${r.items} 約${r.kcal}kcal`;
  const bd = (r.breakdown || []).map(b => `<div class="bdrow"><span>${esc(b.name)}</span><b>${esc(b.kcal)}</b></div>`).join('');
  const title = j.corrected ? '直したよ：' : '記録したよ：';
  $('lastComment').innerHTML = `<div class="comment"><div class="who">${title}${esc(head)}</div>${bd ? `<div class="bdlist">${bd}</div>` : ''}${esc(j.comment || '')}${r.transcript ? `<div class="muted" style="margin-top:6px">聞き取り：「${esc(r.transcript)}」</div>` : ''}<div class="fixrow"><button class="fixbtn" id="fixBtn">✏️ この記録を直す</button><span class="muted">例：大根じゃなくてきのこ／サラダもあった／ご飯は80g</span></div></div>`;
  $('fixBtn').onclick = () => { CORRECT_MODE = true; const ti = $('textInput'); ti.placeholder = '直したいことを書いて送る'; ti.focus(); toast('次に送った文字で、この記録を直すよ'); };
  toast('記録した');
}
async function submitMeal(payload, label) {
  const pid = addPending(label);
  try { const j = await api(Object.assign({ action: 'logMeal' }, payload)); rmPending(pid); onLogged(j); }
  catch (e) { rmPending(pid); toast(e.message || '記録に失敗', true); }
}
async function delLog(id) {
  if (!confirm('この記録を取り消す？')) return;
  try { const j = await api({ action: 'deleteLog', id }); SUMMARY = Object.assign(SUMMARY, j.summary); render(); toast('取り消した'); } catch (e) { toast(e.message, true); }
}

// ---------- 文字 ----------
const CORRECT_RE = /じゃなくて|じゃない|ではなく|違う|ちがう|さっきの|今の|いまの|直して|なおして|修正|間違|まちがい|もあった|はなかった|入ってない|抜けてる|多かった|少なかった|大盛|小盛/;
$('textForm').onsubmit = e => {
  e.preventDefault(); const v = $('textInput').value.trim(); if (!v) return; $('textInput').value = ''; $('textInput').placeholder = '食べたものを入力してみてね（例：昼にラーメン）';
  if (LAST_ID && (CORRECT_MODE || CORRECT_RE.test(v))) { CORRECT_MODE = false; submitCorrection(v); return; }
  submitMeal({ text: v }, '解析中：' + v);
};
async function submitCorrection(text) {
  const pid = addPending('直してる：' + text);
  try { const j = await api({ action: 'correctLog', id: LAST_ID, text }); rmPending(pid); j.corrected = true; onLogged(j); }
  catch (e) { rmPending(pid); toast(e.message || '直せなかった', true); }
}

// ---------- 写真 ----------
$('photoBtn').onclick = () => $('photoSheet').classList.remove('hidden');
$('pickCancel').onclick = () => $('photoSheet').classList.add('hidden');
$('photoSheet').onclick = e => { if (e.target.id === 'photoSheet') $('photoSheet').classList.add('hidden'); };
$('pickCamera').onclick = () => { $('photoSheet').classList.add('hidden'); $('cameraInput').click(); };
$('pickAlbum').onclick = () => { $('photoSheet').classList.add('hidden'); $('photoInput').click(); };
$('cameraInput').onchange = e => $('photoInput').onchange(e);
$('photoInput').onchange = async e => {
  const f = e.target.files[0]; if (!f) return; e.target.value = '';
  const note = $('textInput').value.trim(); $('textInput').value = '';
  const pid = addPending('写真を縮小中…');
  try {
    const b64 = await shrinkImage(f, 1024, 0.82);
    rmPending(pid);
    submitMeal({ imageBase64: b64, imageMime: 'image/jpeg', text: note || undefined }, '写真を解析中' + (note ? '：' + note : ''));
  } catch (err) { rmPending(pid); toast('写真の読み込みに失敗', true); }
};
function shrinkImage(file, maxSide, q) {
  return new Promise((res, rej) => {
    const img = new Image(); const url = URL.createObjectURL(file);
    img.onload = () => {
      let w = img.width, h = img.height; const sc = Math.min(1, maxSide / Math.max(w, h)); w = Math.round(w * sc); h = Math.round(h * sc);
      const c = document.createElement('canvas'); c.width = w; c.height = h; c.getContext('2d').drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);
      res(c.toDataURL('image/jpeg', q).split(',')[1]);
    };
    img.onerror = rej; img.src = url;
  });
}

// ---------- 音声（MediaRecorder, iOS対応, 無音で自動送信） ----------
let mediaRecorder = null, chunks = [], isRec = false, audioCtx = null, silenceTimer = null, discard = false;
const SILENCE_MS = 4000, NO_SPEECH_MS = 10000, RMS = 0.015;
$('micBtn').onclick = () => isRec ? stopRec() : startRec();
async function startRec() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { toast('この環境ではマイクが使えない。文字で入れてね', true); return; }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } });
    chunks = []; discard = false;
    let mime = '';
    if (window.MediaRecorder) { for (const m of ['audio/mp4', 'audio/webm;codecs=opus', 'audio/webm']) if (MediaRecorder.isTypeSupported(m)) { mime = m; break; } }
    mediaRecorder = new MediaRecorder(stream, mime ? { mimeType: mime } : {});
    mediaRecorder.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
    mediaRecorder.onstop = async () => {
      stream.getTracks().forEach(t => t.stop()); stopSilence();
      resetMic();
      if (discard) { discard = false; return; }
      const actual = mediaRecorder.mimeType || mime || 'audio/mp4';
      const blob = new Blob(chunks, { type: actual });
      const b64 = await new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result.split(',')[1]); fr.readAsDataURL(blob); });
      const note = $('textInput').value.trim(); $('textInput').value = '';
      submitMeal({ audioBase64: b64, audioMime: actual.split(';')[0], text: note || undefined }, '声を解析中…');
    };
    mediaRecorder.start(); isRec = true;
    $('micBtn').classList.add('recording'); $('micBtn').innerHTML = '<span class="ic">⏹</span>タップで送信';
    $('voiceStatus').innerText = '🔴 聞いてるよ。4秒黙ると自動で送る';
    startSilence(stream);
  } catch (e) { toast('マイクが許可されていない。設定で許可してね', true); }
}
function stopRec() { if (!isRec) return; isRec = false; stopSilence(); if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop(); }
function resetMic() { isRec = false; $('micBtn').classList.remove('recording'); $('micBtn').innerHTML = '<span class="ic">🎤</span>話して記録'; $('voiceStatus').innerText = ''; }
function startSilence(stream) {
  try {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)(); if (audioCtx.state === 'suspended') audioCtx.resume();
    const an = audioCtx.createAnalyser(); an.fftSize = 1024; audioCtx.createMediaStreamSource(stream).connect(an);
    const buf = new Float32Array(an.fftSize); const t0 = Date.now(); let last = 0, spoke = false;
    silenceTimer = setInterval(() => {
      an.getFloatTimeDomainData(buf); let s = 0; for (let i = 0; i < buf.length; i++) s += buf[i] * buf[i];
      const rms = Math.sqrt(s / buf.length), now = Date.now();
      if (rms > RMS) { spoke = true; last = now; $('voiceStatus').innerText = '🔴 聞いてるよ…'; }
      else if (spoke) { const left = Math.ceil((SILENCE_MS - (now - last)) / 1000); if (left <= 0) { stopRec(); return; } $('voiceStatus').innerText = `🔴 あと${left}秒で送る（続けて話せる）`; }
      else if (now - t0 > NO_SPEECH_MS) { discard = true; stopRec(); toast('声が聞こえなかったので取り消し', true); }
    }, 200);
  } catch (e) {}
}
function stopSilence() { clearInterval(silenceTimer); silenceTimer = null; if (audioCtx) { try { audioCtx.close(); } catch (e) {} audioCtx = null; } }

// ---------- 体重 ----------
async function logWeight(wEl, fEl, btn) {
  const w = parseFloat(wEl.value); if (!w) { toast('体重を入れてね', true); return; }
  const f = fEl.value ? parseFloat(fEl.value) : '';
  btn.disabled = true;
  try { const j = await api({ action: 'logWeight', weight_kg: w, fat_pct: f }); SUMMARY = Object.assign(SUMMARY, j.summary); render(); wEl.value = ''; fEl.value = ''; toast('体重を記録した'); }
  catch (e) { toast(e.message, true); }
  btn.disabled = false;
}
$('wBtn').onclick = () => logWeight($('wIn'), $('fIn'), $('wBtn'));
$('wBtn2').onclick = () => logWeight($('wIn2'), $('fIn2'), $('wBtn2'));

document.querySelectorAll('#periodSeg button').forEach(b => b.onclick = async () => {
  PERIOD = Number(b.dataset.days); document.querySelectorAll('#periodSeg button').forEach(x => x.classList.toggle('on', x === b));
  if (SUMMARY && SUMMARY.daily.length >= PERIOD) render(); else await refresh();
});

// ---------- 総括 ----------
$('reviewBtn').onclick = async () => {
  const b = $('reviewBtn'); b.disabled = true; b.innerText = '7日分を読んでる…';
  try { const j = await api({ action: 'review' }); $('reviewBox').innerHTML = `<div class="comment" style="margin-top:10px"><div class="who">今週の総括</div>${esc(j.review)}</div>`; }
  catch (e) { toast(e.message, true); }
  b.disabled = false; b.innerText = 'もう一度聞く';
};

// ---------- 設定 ----------
let PROFILE = null;
async function loadProfile() {
  try {
    const j = await api({ action: 'getProfile' }); PROFILE = j.profile; const p = PROFILE;
    $('pName').value = p.name || ''; $('pHeight').value = p.height_cm || ''; $('pAge').value = p.age || '';
    $('pStart').value = p.start_weight || ''; $('pGoal').value = p.goal_weight || ''; $('pDate').value = p.goal_date || '';
    $('pKcal').value = p.kcal_target || ''; $('pProt').value = p.protein_target || '';
    $('kcalCard').classList.toggle('hidden', !p.show_numbers);
    paceNote();
  } catch (e) { toast(e.message, true); }
}
function paceNote() {
  const s = parseFloat($('pStart').value), g = parseFloat($('pGoal').value), d = $('pDate').value;
  const el = $('paceNote');
  if (!s || !g || !d) { el.innerText = ''; return; }
  const days = Math.round((new Date(d) - new Date()) / 86400000);
  if (days <= 0) { el.innerText = '期限が過ぎているよ'; return; }
  const perMonth = (s - g) / (days / 30.4);
  const cur = SUMMARY && SUMMARY.latest_weight ? SUMMARY.latest_weight.avg7 : s;
  const remain = Math.max(0, cur - g);
  let msg = `${s}→${g}kg を ${Math.round(days / 7)}週で。月あたり ${perMonth.toFixed(1)}kg ペース`;
  if (SHOW_NUM) msg += `（いま ${cur}kg、あと ${remain.toFixed(1)}kg）`;
  if (perMonth > 2.5) msg += '。これは速すぎる。月2kg以内が安全ライン';
  el.innerText = msg;
}
['pStart', 'pGoal', 'pDate'].forEach(id => $(id).addEventListener('input', paceNote));
$('suggestBtn').onclick = async () => {
  $('suggestNote').innerText = '計算中…';
  try {
    // save current height/age/goal first so the calc uses them
    await api({ action: 'updateProfile', height_cm: $('pHeight').value, age: $('pAge').value, goal_weight: $('pGoal').value, goal_date: $('pDate').value, start_weight: $('pStart').value });
    const j = await api({ action: 'suggestKcal' });
    $('pKcal').value = j.kcal;
    $('suggestNote').innerText = `目安 ${j.kcal}kcal／日。軽い活動量の消費から、期限に間に合う分だけ引いた数字。下限は守ってある`;
  } catch (e) { $('suggestNote').innerText = e.message; }
};
$('saveProfile').onclick = async () => {
  $('saveProfile').disabled = true;
  try {
    const body = { action: 'updateProfile', name: $('pName').value.trim(), height_cm: $('pHeight').value, age: $('pAge').value, start_weight: $('pStart').value, goal_weight: $('pGoal').value, goal_date: $('pDate').value, protein_target: $('pProt').value };
    if (SHOW_NUM) body.kcal_target = $('pKcal').value;
    const j = await api(body);
    PROFILE = j.profile; SUMMARY = Object.assign(SUMMARY || {}, j.summary); render(); toast('保存した');
    if (j.profile.kcal_target && String(j.profile.kcal_target) !== String($('pKcal').value)) { $('pKcal').value = j.profile.kcal_target; toast('下限より低かったので目安を調整した', true); }
  } catch (e) { toast(e.message, true); }
  $('saveProfile').disabled = false;
};
$('logoutLink').onclick = e => { e.preventDefault(); if (!confirm('この端末の合言葉を消して入り直す？')) return; localStorage.removeItem(LS.u); localStorage.removeItem(LS.t); localStorage.removeItem(LS.chat); location.href = location.pathname; };

// ---------- 相談 ----------
let CHAT = JSON.parse(localStorage.getItem(LS.chat) || '[]');
function renderChat() {
  const L = $('chatLog');
  L.innerHTML = CHAT.slice(-30).map(m => `<div class="msg ${m.r === 'u' ? 'u' : 'a'}">${esc(m.t)}</div>`).join('') || '<div class="muted" style="text-align:center;padding:30px 0">「なんか食べたい！」とか「今日どう？」とか、気軽に。</div>';
}
async function sendChat(text) {
  if (!text) return;
  CHAT.push({ r: 'u', t: text }); renderChat(); window.scrollTo(0, document.body.scrollHeight);
  const L = $('chatLog'); const th = document.createElement('div'); th.className = 'msg a'; th.innerHTML = '<div class="spin"></div>'; L.appendChild(th);
  try {
    const j = await api({ action: 'chat', message: text });
    CHAT.push({ r: 'a', t: j.reply }); localStorage.setItem(LS.chat, JSON.stringify(CHAT.slice(-60)));
    if (SUMMARY) SUMMARY.today = j.today;
  } catch (e) { CHAT.push({ r: 'a', t: '（つながらなかった… ' + e.message + '）' }); }
  renderChat(); window.scrollTo(0, document.body.scrollHeight);
}
$('chatForm').onsubmit = e => { e.preventDefault(); const v = $('chatInput').value.trim(); $('chatInput').value = ''; sendChat(v); };
document.querySelectorAll('.quick button').forEach(b => b.onclick = () => sendChat(b.dataset.q));

// ---------- SW ----------
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
boot();
</script>
